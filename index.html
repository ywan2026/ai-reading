<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>대신 읽어주는 AI에서 읽기를 돕는 AI로 · AI와 독서교육</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* ============ macOS 스타일 ============ */
:root{
  --bg-win: rgba(255,255,255,.78);
  --bg-side: rgba(244,244,247,.72);
  --bg-card: rgba(255,255,255,.9);
  --line: rgba(0,0,0,.09);
  --text: #1d1d1f;
  --sub: #6e6e73;
  --blue: #0a84ff;
  --blue-soft: rgba(10,132,255,.12);
  --green: #30d158;
  --green-soft: rgba(48,209,88,.14);
  --orange: #ff9f0a;
  --orange-soft: rgba(255,159,10,.14);
  --red: #ff453a;
  --red-soft: rgba(255,69,58,.12);
  --purple: #bf5af2;
  --purple-soft: rgba(191,90,242,.12);
  --radius: 14px;
  --shadow: 0 30px 80px rgba(0,0,0,.28), 0 0 0 .5px rgba(0,0,0,.2);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",sans-serif;
  color:var(--text);
  background:
    radial-gradient(1200px 800px at 10% 10%, #6e8efb 0%, transparent 60%),
    radial-gradient(900px 700px at 90% 20%, #c471ed 0%, transparent 55%),
    radial-gradient(1000px 900px at 60% 100%, #f7797d 0%, transparent 60%),
    #2b2d5a;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}

/* 메뉴바 */
.menubar{
  position:fixed;top:0;left:0;right:0;height:28px;z-index:20;
  display:flex;align-items:center;gap:18px;padding:0 16px;
  background:rgba(255,255,255,.35);backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  font-size:13px;font-weight:500;color:#1d1d1f;
}
.menubar b{font-weight:700}
.menubar .right{margin-left:auto;display:flex;gap:14px;align-items:center}
.menubar .clock{font-variant-numeric:tabular-nums}

/* 창 */
.window{
  position:fixed;top:40px;left:16px;right:16px;bottom:16px;
  display:grid;grid-template-columns:250px 1fr;grid-template-rows:46px 1fr 50px;
  background:var(--bg-win);border-radius:12px;box-shadow:var(--shadow);
  backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);
  overflow:hidden;
}
.titlebar{
  grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:0 14px;
  border-bottom:1px solid var(--line);background:rgba(246,246,248,.7);
}
.lights{display:flex;gap:8px}
.lights span{width:12px;height:12px;border-radius:50%;display:block;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.15)}
.lights .r{background:#ff5f57}.lights .y{background:#febc2e}.lights .g{background:#28c840}
.titlebar .title{flex:1;text-align:center;font-size:13px;font-weight:600;color:#3a3a3c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:flex;background:rgba(0,0,0,.06);border-radius:8px;padding:2px}
.seg button{border:0;background:transparent;font:inherit;font-size:12px;font-weight:600;padding:5px 12px;border-radius:6px;color:#3a3a3c;cursor:pointer}
.seg button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.15);color:#000}
.icon-btn{border:0;background:transparent;font-size:15px;cursor:pointer;padding:5px 7px;border-radius:6px;color:#3a3a3c}
.icon-btn:hover{background:rgba(0,0,0,.06)}

/* 사이드바 */
.sidebar{
  grid-row:2/4;background:var(--bg-side);border-right:1px solid var(--line);
  overflow-y:auto;padding:12px 10px 20px;
}
.side-group{margin-bottom:12px}
.side-head{font-size:11px;font-weight:700;color:var(--sub);padding:6px 10px 4px;display:flex;justify-content:space-between}
.side-head .min{font-weight:600;color:#9a9aa0}
.side-item{
  display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:7px;
  font-size:13px;cursor:pointer;color:#1d1d1f;line-height:1.35;
}
.side-item:hover{background:rgba(0,0,0,.05)}
.side-item.on{background:var(--blue);color:#fff}
.side-item .num{font-size:11px;color:#9a9aa0;width:16px;text-align:right;flex:none}
.side-item.on .num{color:rgba(255,255,255,.8)}

/* 스테이지 */
.stage{overflow-y:auto;position:relative;scroll-behavior:smooth}
.slide{
  max-width:1120px;margin:0 auto;padding:44px 56px 56px;
  display:none;animation:fade .35s ease;
}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
body.present .slide.active{display:block}
body.doc .slide{display:block;animation:none;border-bottom:1px solid var(--line);padding-top:56px;padding-bottom:64px}
body.doc .slide:last-child{border-bottom:0}

.toolbar{
  display:flex;align-items:center;gap:12px;padding:0 16px;
  border-top:1px solid var(--line);background:rgba(246,246,248,.7);font-size:13px;
}
.toolbar .nav{display:flex;gap:6px}
.btn{
  border:0;font:inherit;font-size:13px;font-weight:600;cursor:pointer;
  padding:7px 14px;border-radius:8px;background:#fff;color:#1d1d1f;
  box-shadow:0 0 0 .5px rgba(0,0,0,.15),0 1px 2px rgba(0,0,0,.08);
}
.btn:hover{background:#f5f5f7}
.btn.primary{background:var(--blue);color:#fff;box-shadow:none}
.btn.primary:hover{background:#0077ed}
.btn:disabled{opacity:.45;cursor:default}
.progress{flex:1;height:5px;background:rgba(0,0,0,.08);border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--blue);border-radius:3px;transition:width .3s}
.counter{font-variant-numeric:tabular-nums;color:var(--sub);min-width:58px;text-align:right}
.timer{font-variant-numeric:tabular-nums;color:var(--sub);cursor:pointer;padding:4px 8px;border-radius:6px}
.timer:hover{background:rgba(0,0,0,.05)}
body.doc .toolbar .nav, body.doc .toolbar .counter{visibility:hidden}

/* ============ 슬라이드 요소 ============ */
.kicker{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--blue-soft);color:var(--blue)}
.chip.gray{background:rgba(0,0,0,.06);color:#48484a}
.chip.green{background:var(--green-soft);color:#1a9e45}
.chip.orange{background:var(--orange-soft);color:#c77800}
.chip.purple{background:var(--purple-soft);color:#9b3bc9}
.chip.red{background:var(--red-soft);color:#d12c22}
h1{font-size:clamp(34px,4.6vw,58px);font-weight:800;letter-spacing:-.03em;line-height:1.15}
h2{font-size:clamp(26px,3vw,38px);font-weight:800;letter-spacing:-.025em;line-height:1.25;margin-bottom:8px}
h3{font-size:19px;font-weight:700;letter-spacing:-.01em;margin-bottom:8px}
.lead{font-size:clamp(16px,1.5vw,19px);color:var(--sub);line-height:1.6;margin-bottom:26px}
p,li{font-size:16px;line-height:1.7}
ul.clean{list-style:none}
ul.clean li{position:relative;padding-left:18px;margin:4px 0}
ul.clean li::before{content:"";position:absolute;left:3px;top:.72em;width:6px;height:6px;border-radius:50%;background:#c7c7cc}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.card{
  background:var(--bg-card);border-radius:var(--radius);padding:20px 22px;
  box-shadow:0 0 0 .5px rgba(0,0,0,.08),0 2px 10px rgba(0,0,0,.05);
}
.card.blue{background:linear-gradient(180deg,#eef6ff,#fff)}
.card.green{background:linear-gradient(180deg,#ecfbf0,#fff)}
.card.orange{background:linear-gradient(180deg,#fff6e8,#fff)}
.card.red{background:linear-gradient(180deg,#fff0ef,#fff)}
.card.purple{background:linear-gradient(180deg,#f8efff,#fff)}
.card .label{font-size:12px;font-weight:700;color:var(--sub);margin-bottom:6px;letter-spacing:.02em}
.stat{font-size:clamp(40px,5vw,64px);font-weight:800;letter-spacing:-.04em;line-height:1}
.stat small{font-size:.38em;font-weight:700;margin-left:4px;color:var(--sub)}
.stat-desc{margin-top:10px;font-size:15px;color:#3a3a3c;line-height:1.55}
.callout{
  margin-top:22px;padding:20px 24px;border-radius:var(--radius);
  background:#1d1d1f;color:#fff;font-size:clamp(17px,1.7vw,21px);font-weight:700;line-height:1.55;letter-spacing:-.01em;
}
.callout .sub{display:block;font-size:14px;font-weight:500;color:#aeaeb2;margin-top:6px}
.callout.blue{background:linear-gradient(135deg,#0a84ff,#5e5ce6)}
.mt{margin-top:18px}.mt-s{margin-top:10px}
.src{margin-top:16px;font-size:12.5px;color:var(--sub);line-height:1.7}
.src a{margin-right:10px}
.muted{color:var(--sub)}
.big-q{font-size:clamp(24px,3vw,36px);font-weight:800;letter-spacing:-.02em;line-height:1.4;margin:6px 0 20px}

table.mac{width:100%;border-collapse:separate;border-spacing:0;background:#fff;border-radius:var(--radius);overflow:hidden;box-shadow:0 0 0 .5px rgba(0,0,0,.1)}
table.mac th{font-size:14px;font-weight:700;text-align:left;padding:13px 18px;background:#f5f5f7;border-bottom:1px solid var(--line)}
table.mac td{font-size:15.5px;padding:12px 18px;border-bottom:1px solid var(--line);vertical-align:top}
table.mac tr:last-child td{border-bottom:0}
table.mac th.bad{color:#d12c22}table.mac th.good{color:#1a9e45}

.steps{counter-reset:s;display:grid;gap:10px}
.step{display:flex;gap:14px;align-items:flex-start;background:var(--bg-card);border-radius:12px;padding:14px 18px;box-shadow:0 0 0 .5px rgba(0,0,0,.08)}
.step::before{counter-increment:s;content:counter(s);flex:none;width:28px;height:28px;border-radius:50%;background:var(--blue);color:#fff;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;margin-top:1px}
.step b{display:block;font-size:16px;margin-bottom:2px}
.step span{font-size:14.5px;color:#48484a;line-height:1.55}

.timeline{position:relative;padding-left:22px}
.timeline::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:#e5e5ea}
.tl{position:relative;margin-bottom:14px}
.tl::before{content:"";position:absolute;left:-21px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--red);box-shadow:0 0 0 3px #fff}
.tl .when{font-size:12px;font-weight:700;color:var(--red)}
.tl .what{font-size:15.5px;line-height:1.55}

.linkbtn{
  display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:10px;
  background:var(--blue);color:#fff !important;font-weight:700;font-size:15px;text-decoration:none !important;
}
.linkbtn:hover{background:#0077ed}
.linkbtn.ghost{background:#fff;color:var(--blue) !important;box-shadow:0 0 0 1px rgba(10,132,255,.35)}
.linkbtn.big{padding:16px 26px;font-size:18px;border-radius:12px}
.linkbtn.off{background:#e5e5ea;color:#8e8e93 !important;cursor:default}

.prompt{
  position:relative;background:#1e1e22;color:#e5e5ea;border-radius:12px;padding:16px 18px 16px;
  font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;font-size:13.5px;line-height:1.65;white-space:pre-wrap;
}
.prompt .copy{position:absolute;top:10px;right:10px;border:0;background:rgba(255,255,255,.12);color:#fff;font:600 12px "Pretendard Variable",sans-serif;padding:5px 10px;border-radius:6px;cursor:pointer}
.prompt .copy:hover{background:rgba(255,255,255,.22)}
.prompt-title{font-size:13px;font-weight:700;margin:14px 0 6px;color:#3a3a3c}

.placeholder{border:2px dashed #c7c7cc;border-radius:var(--radius);padding:18px 20px;color:var(--sub);background:rgba(255,255,255,.5)}

.flow{display:flex;align-items:stretch;gap:8px;flex-wrap:wrap}
.flow .node{flex:1;min-width:140px;background:var(--bg-card);border-radius:12px;padding:14px 16px;box-shadow:0 0 0 .5px rgba(0,0,0,.08)}
.flow .node b{display:block;font-size:15px;margin-bottom:3px}
.flow .node span{font-size:13.5px;color:#48484a;line-height:1.5}
.flow .arrow{display:flex;align-items:center;color:#c7c7cc;font-size:22px;font-weight:700}

.agenda{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:30px}
.agenda .card{padding:14px 16px}
.agenda .n{font-size:12px;font-weight:800;color:var(--blue)}
.agenda .t{font-size:15px;font-weight:700;margin-top:2px}
.agenda .m{font-size:12.5px;color:var(--sub)}

.title-wrap{display:grid;grid-template-columns:1fr auto;gap:30px;align-items:end;min-height:60vh}
.qr{background:#fff;padding:12px;border-radius:14px;box-shadow:0 0 0 .5px rgba(0,0,0,.1);text-align:center}
.qr img{display:block;width:150px;height:150px}
.qr small{display:block;font-size:11.5px;color:var(--sub);margin-top:6px}

.ref-group{margin-bottom:20px}
.ref-group h3{font-size:15px;color:var(--sub);margin-bottom:8px}
.ref{display:block;padding:12px 16px;background:var(--bg-card);border-radius:10px;margin-bottom:8px;box-shadow:0 0 0 .5px rgba(0,0,0,.08);color:var(--text) !important;text-decoration:none !important}
.ref:hover{box-shadow:0 0 0 1.5px var(--blue)}
.ref b{display:block;font-size:15px}
.ref span{font-size:13px;color:var(--sub)}
.ref .go{float:right;color:var(--blue);font-weight:700;font-size:13px}

/* 응답 보드 */
.board{background:rgba(255,255,255,.6);border-radius:var(--radius);padding:16px;box-shadow:0 0 0 .5px rgba(0,0,0,.08)}
.board-form{display:flex;gap:8px;flex-wrap:wrap}
.board-form input{
  font:inherit;font-size:15px;padding:11px 14px;border-radius:10px;border:0;background:#fff;
  box-shadow:0 0 0 .5px rgba(0,0,0,.18);outline:none;
}
.board-form input:focus{box-shadow:0 0 0 3px rgba(10,132,255,.35)}
.board-form .name{width:130px}
.board-form .text{flex:1;min-width:200px}
.board-meta{display:flex;justify-content:space-between;align-items:center;margin:12px 2px 10px;font-size:12.5px;color:var(--sub)}
.board-meta .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#c7c7cc;margin-right:6px;vertical-align:1px}
.board-meta .dot.live{background:var(--green);box-shadow:0 0 0 3px rgba(48,209,88,.25)}
.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;max-height:420px;overflow-y:auto;padding:2px}
.note{background:#fff8c5;border-radius:10px;padding:12px 14px;font-size:15px;line-height:1.5;box-shadow:0 1px 3px rgba(0,0,0,.1);animation:pop .3s ease;word-break:break-word}
.note:nth-child(4n+2){background:#d9f2ff}.note:nth-child(4n+3){background:#e3f9df}.note:nth-child(4n+4){background:#fde4ef}
.note .who{display:block;font-size:12px;color:#6e6e73;margin-top:6px;font-weight:600}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
.empty{grid-column:1/-1;text-align:center;color:var(--sub);font-size:14px;padding:22px}

.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%) translateY(20px);opacity:0;background:rgba(30,30,30,.9);color:#fff;font-size:14px;font-weight:600;padding:10px 18px;border-radius:10px;transition:.25s;z-index:50;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}

/* 전체화면 발표 */
body.fs .menubar{display:none}
body.fs .window{top:0;left:0;right:0;bottom:0;border-radius:0}
body.fs.present .window{grid-template-columns:0 1fr}
body.fs.present .sidebar{display:none}

/* 반응형 */
@media (max-width:980px){
  .g3,.g4{grid-template-columns:repeat(2,1fr)}
  .agenda{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:760px){
  body{overflow:auto}
  .menubar{display:none}
  .window{position:static;display:block;min-height:100vh;border-radius:0;box-shadow:none;overflow:visible}
  .qr{display:none}
  .titlebar{position:sticky;top:0;z-index:10;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
  .titlebar .title{text-align:left}
  .lights{display:none}
  .sidebar{display:none}
  .sidebar.open{display:block;position:fixed;top:46px;left:0;right:0;bottom:0;z-index:30;background:rgba(244,244,247,.97)}
  .stage{overflow:visible}
  .slide{padding:30px 20px 40px}
  .g2,.g3,.g4,.agenda{grid-template-columns:1fr}
  .title-wrap{grid-template-columns:1fr;min-height:auto}
  .toolbar{position:sticky;bottom:0;background:rgba(246,246,248,.95)}
  .board-form .name{width:100%}
  .flow .arrow{display:none}
  table.mac td,table.mac th{padding:10px 12px;font-size:14px}
}
#menuBtn{display:none}
@media (max-width:760px){#menuBtn{display:block}}

/* 메뉴바 버튼 */
.mb-btn{border:0;background:transparent;font:inherit;font-size:13px;font-weight:600;color:#1d1d1f;cursor:pointer;padding:2px 8px;border-radius:5px}
.mb-btn:hover{background:rgba(0,0,0,.08)}

/* 차트 */
.chart-card{background:var(--bg-card);border-radius:var(--radius);padding:18px 20px 14px;box-shadow:0 0 0 .5px rgba(0,0,0,.08),0 2px 10px rgba(0,0,0,.05)}
.chart-card h3{font-size:16px;margin-bottom:2px}
.chart-card .cap{font-size:13px;color:var(--sub);margin-bottom:10px}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart .grid-l{stroke:#e5e5ea;stroke-width:1}
.chart .axis-t{font-size:12px;fill:#8e8e93}
.chart .val-t{font-size:13px;font-weight:700;fill:#1d1d1f}
.chart .hit{fill:transparent;cursor:pointer}
.chart .pt{transition:r .15s}
.chart .hit:hover + .pt{r:8}
.waffle{display:grid;grid-template-columns:repeat(20,1fr);gap:3px;margin-top:6px}
.waffle i{aspect-ratio:1;border-radius:3px;background:#e5e5ea}
.waffle i.on{background:var(--orange)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:#48484a;margin-top:10px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--c)}
.hbar{display:grid;grid-template-columns:120px 1fr 44px;align-items:center;gap:10px;margin:7px 0;font-size:14px}
.hbar .track{height:14px;background:#f2f2f7;border-radius:4px;overflow:hidden}
.hbar .fill{height:100%;background:var(--blue);border-radius:0 4px 4px 0}
.hbar b{font-variant-numeric:tabular-nums;text-align:right}
.dumb{display:grid;grid-template-columns:110px 1fr;gap:10px;align-items:center;font-size:13.5px;margin:8px 0}
.dumb .line{position:relative;height:22px}
.dumb .line::before{content:"";position:absolute;left:0;right:0;top:10px;height:2px;background:#f2f2f7}
.dumb .seg{position:absolute;top:10px;height:2px;background:#c7c7cc}
.dumb .p{position:absolute;top:4px;width:14px;height:14px;border-radius:50%;transform:translateX(-50%);box-shadow:0 0 0 2px #fff}
.dumb .p em{position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-style:normal;font-size:11.5px;font-weight:700;white-space:nowrap;color:#1d1d1f}

/* 퀴즈 */
.quiz{background:var(--bg-card);border-radius:var(--radius);padding:18px 20px;box-shadow:0 0 0 .5px rgba(0,0,0,.08),0 2px 10px rgba(0,0,0,.05)}
.quiz .q{font-size:18px;font-weight:800;margin-bottom:12px;letter-spacing:-.01em}
.quiz .opts{display:grid;gap:8px}
.quiz .opt{position:relative;display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;font:inherit;font-size:15.5px;font-weight:600;padding:12px 14px;border-radius:10px;background:#f2f2f7;cursor:pointer;overflow:hidden;color:#1d1d1f}
.quiz .opt:hover{background:#e8e8ed}
.quiz .opt.mine{box-shadow:0 0 0 2px var(--blue);background:#eef6ff}
.quiz .opt .bar{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(10,132,255,.14);transition:width .5s}
.quiz .opt .lbl{position:relative;flex:1}
.quiz .opt .pct{position:relative;font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums;display:none}
.quiz.revealed .opt .pct{display:inline}
.quiz.revealed .opt.correct{background:#ecfbf0}
.quiz.revealed .opt.correct .bar{background:rgba(48,209,88,.25)}
.quiz.revealed .opt.correct .lbl::after{content:"  ✓ 정답";color:#1a9e45;font-weight:800}
.quiz .qfoot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:13px;color:var(--sub);gap:10px;flex-wrap:wrap}
.quiz .answer{display:none;margin-top:12px;padding:12px 14px;border-radius:10px;background:#ecfbf0;font-size:15px;line-height:1.6}
.quiz.revealed .answer{display:block}
.reveal-box{display:none}
.reveal-box.show{display:block;animation:fade .4s ease}
.reveal-btn{margin-top:18px}

/* 이미지 */
.shot{width:100%;border-radius:12px;box-shadow:0 0 0 .5px rgba(0,0,0,.12),0 8px 24px rgba(0,0,0,.12);display:block;background:#fff}
.shot-wrap .placeholder{display:none}
.shot-wrap.missing .shot{display:none}
.shot-wrap.missing .placeholder{display:block;min-height:220px}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}

/* QR 모달 */
.modal{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.modal.show{display:flex}
.modal .box{background:#fff;border-radius:16px;padding:26px 28px;text-align:center;box-shadow:var(--shadow);max-width:92vw;animation:pop .25s ease}
.modal .box img{width:min(340px,70vw);height:min(340px,70vw);display:block;margin:12px auto}
.modal .box .u{font-size:13px;color:var(--sub);word-break:break-all;max-width:360px;margin:0 auto 14px}

/* PDF 인쇄 */
@media print{
  @page{size:A4 landscape;margin:10mm}
  html,body{height:auto;overflow:visible !important;background:#fff !important}
  body{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .menubar,.titlebar,.sidebar,.toolbar,.toast,.modal,.board-form,.reveal-btn,.quiz .qfoot button,.prompt .copy{display:none !important}
  .window{position:static !important;display:block !important;box-shadow:none !important;border-radius:0 !important;background:#fff !important;backdrop-filter:none !important;overflow:visible !important}
  .stage{overflow:visible !important}
  .slide{zoom:.72;display:block !important;animation:none !important;padding:4mm 4mm !important;max-width:none !important;border:0 !important;break-after:page;page-break-after:always}
  .slide:last-child{break-after:auto;page-break-after:auto}
  .reveal-box{display:block !important}
  .board-meta{display:none !important}
  .closing{min-height:auto !important}
  .quiz .answer{display:block !important}
  .notes{max-height:none !important;overflow:visible !important}
  .card,.chart-card,.quiz,.step,.ref,.flow .node{break-inside:avoid}
  .title-wrap,.closing{min-height:auto !important}
  a{color:#0a84ff !important}
}
@media (max-width:760px){
  body.doc .toolbar{display:none}
  #fsBtn{display:none}
  .titlebar{gap:8px;padding:0 10px}
  .titlebar .title{font-size:12.5px}
  .lead{font-size:15.5px}
  .big-q{font-size:22px}
  .callout{font-size:16.5px;padding:16px 18px}
  .quiz .q{font-size:16.5px}
  .hbar{grid-template-columns:96px 1fr 40px;font-size:13px}
}
</style>

/* ---------- 차트 ---------- */
function pisaChart(){
  const data = [[2006,556],[2012,536],[2022,515],[2025,501]];
  const W=520,H=250,pl=44,pr=24,pt=26,pb=34, min=440, max=580;
  const xs = i => pl + i*(W-pl-pr)/(data.length-1);
  const ys = v => pt + (max-v)/(max-min)*(H-pt-pb);
  const ticks=[460,500,540,580];
  const oecd = 461;
  let g = ticks.map(t=>`<line class="grid-l" x1="${pl}" x2="${W-pr}" y1="${ys(t)}" y2="${ys(t)}"/><text class="axis-t" x="${pl-8}" y="${ys(t)+4}" text-anchor="end">${t}</text>`).join('');
  g += `<line x1="${pl}" x2="${W-pr}" y1="${ys(oecd)}" y2="${ys(oecd)}" stroke="#8e8e93" stroke-width="1.5" stroke-dasharray="4 4"/><text class="axis-t" x="${W-pr}" y="${ys(oecd)-6}" text-anchor="end">OECD 평균 461 (2025)</text>`;
  const path = data.map((d,i)=>`${i?'L':'M'}${xs(i)},${ys(d[1])}`).join(' ');
  g += `<path d="${path}" fill="none" stroke="#0a84ff" stroke-width="2.5" stroke-linejoin="round"/>`;
  data.forEach((d,i)=>{
    const last = i===data.length-1;
    g += `<g><title>${d[0]}년: ${d[1]}점</title><circle class="hit" cx="${xs(i)}" cy="${ys(d[1])}" r="18"/><circle class="pt" cx="${xs(i)}" cy="${ys(d[1])}" r="${last?7:5}" fill="${last?'#ff453a':'#0a84ff'}" stroke="#fff" stroke-width="2"/></g>`;
    g += `<text class="val-t" x="${xs(i)}" y="${ys(d[1])-13}" text-anchor="middle" ${last?'style="fill:#d12c22"':''}>${d[1]}</text>`;
    g += `<text class="axis-t" x="${xs(i)}" y="${H-10}" text-anchor="middle">${d[0]}</text>`;
  });
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="PISA 한국 읽기 점수 추이: 2006년 556점, 2012년 536점, 2022년 515점, 2025년 501점">${g}</svg></div>`;
}
function waffle(pct){
  const on = Math.round(pct); // 100칸 중
  return `<div class="waffle" role="img" aria-label="중1 읽기 저수행군 ${pct}%">${Array.from({length:100},(_,i)=>`<i class="${i<on?'on':''}"></i>`).join('')}</div>`;
}
function dumbbell(label, a, b, color){
  const x = v => (v/20*100).toFixed(1)+'%';
  const lo=Math.min(a,b), hi=Math.max(a,b);
  return `<div class="dumb"><span>${label}</span><div class="line">
    <div class="seg" style="left:${x(lo)};width:calc(${x(hi)} - ${x(lo)})"></div>
    <div class="p" style="left:${x(a)};background:#c7c7cc"><em style="color:#8e8e93">${a}%</em></div>
    <div class="p" style="left:${x(b)};background:${color}"><em>${b}%</em></div>
  </div></div>`;
}
function hbars(rows){
  return rows.map(r=>`<div class="hbar"><span>${r[0]}</span><div class="track"><div class="fill" style="width:${r[1]/5*100}%"></div></div><b>${r[1].toFixed(2)}</b></div>`).join('');
}

  <div class="card green"><div class="label">오해</div><h3>오프로딩은 나쁘다?</h3><p>아닙니다. <b>노트 쓰기</b>도 기억 부담을 종이에 덜어내는 오프로딩이에요.</p></div>
  <div class="card red"><div class="label">진짜 문제</div><h3>배울 과정을 넘길 때</h3><p>배워야 할 <b>과정 자체</b>를 도구에 맡기면, 그 능력은 자라지 않습니다.</p></div>
  <div class="card orange"><div class="label">읽기에서는</div><h3>요약·추론·해석</h3><p>AI에 넘기는 요약, 추론, 해석은 <b>곧 읽기 그 자체</b>입니다.</p></div>
</div>
<h3 class="mt">무엇을 넘기고, 무엇을 지킬까</h3>
<table class="mac">
  <tr><th class="good">넘겨도 되는 것 (좋은 오프로딩)</th><th class="bad">지켜야 하는 것 (넘기면 안 됨)</th></tr>
  <tr><td>모르는 단어의 뜻 확인</td><td>중심 내용 파악</td></tr>
  <tr><td>배경지식 찾기</td><td>추론하기</td></tr>
  <tr><td>어려운 문장의 구조 설명</td><td>나의 해석과 평가</td></tr>
</table>`},

/* 오프로딩 연구 */
{sec:'s1', nav:'오프로딩 연구: AI와 비판적 사고', html:`
<div class="kicker"><span class="chip">1. 도입</span></div>
<h2>AI에 넘길수록, 덜 생각하게 된다</h2>
<p class="lead">AI 과의존은 비판적 사고를 약하게 하고, ‘이해했다는 착각’을 만듭니다.</p>
<div class="grid g2">
  <div class="card purple">
    <div class="kicker"><span class="chip purple">Gerlich (2025) · Societies</span></div>
    <h3>AI 사용 빈도와 비판적 사고</h3>
    <ul class="clean">
      <li>다양한 연령·학력의 <b>666명</b> 설문과 심층 면담</li>
      <li>AI 도구를 자주 쓸수록 <b>비판적 사고력이 낮았고</b></li>
      <li>그 사이를 <b>인지적 오프로딩 증가</b>가 매개</li>
    </ul>
    <p class="muted mt-s" style="font-size:13.5px">⚠️ 상관연구: AI 사용이 원인이라고 단정할 수는 없음</p>
  </div>
  <div class="card blue">
    <div class="kicker"><span class="chip">Wang &amp; Luo (2026) · AAAI</span></div>
    <h3>AI와 함께 읽을 때 생기는 착각</h3>
    <ul class="clean">
      <li>AI를 활용한 학술 읽기 경험을 질적으로 분석</li>
      <li>AI에 <b>과하게 의존</b>할수록 인지적 오프로딩과</li>
      <li><b>‘이해했다는 착각(illusory sense of mastery)’</b>이 나타남</li>
    </ul>
    <p class="muted mt-s" style="font-size:13.5px">→ 다음 장의 실험이 이 착각을 직접 보여줍니다.</p>
  </div>
</div>
${src('gerlich','aaai')}`},

/* Kreijkes 퀴즈 */
{sec:'s1', nav:'AI와 읽기 실험 (Kreijkes 외)', html:`
<div class="kicker"><span class="chip">1. 도입</span><span class="chip purple">먼저 추측해 보세요</span></div>
<h2>AI로 공부한 학생 vs 노트를 쓴 학생</h2>
<p class="lead">Kreijkes 외 (2026), <i>Computers &amp; Education</i> · Cambridge University Press &amp; Assessment × Microsoft Research</p>
<div class="flow">
  <div class="node"><b>👩‍🎓 참가자</b><span>영국 7개교, 만 14~15세 중등학생 405명</span></div>
  <div class="arrow">›</div>
  <div class="node"><b>📄 과제</b><span>역사 지문 2개<br>(아파르트헤이트, 쿠바 미사일 위기)</span></div>
  <div class="arrow">›</div>
  <div class="node"><b>🔀 조건</b><span>AI만 · 노트만 · 노트+AI</span></div>
  <div class="arrow">›</div>
  <div class="node"><b>📝 측정</b><span>3일 뒤 이해·기억 시험</span></div>
</div>
<div class="grid g2 mt">
  ${quiz('guess1','Q1. 이해·기억 시험에서 어느 집단의 성취가 가장 높았을까요?',
    [{v:'ai',t:'🤖 AI 챗봇만 사용'},{v:'note',t:'✍️ 노트만 작성'},{v:'both',t:'✍️+🤖 노트와 AI 함께'}],
    ['note','both'],
    '<b>노트를 쓴 집단!</b> 노트만 쓴 학생, 노트와 AI를 함께 쓴 학생 모두 <b>AI만 쓴 학생보다</b> 이해와 기억이 높았습니다.')}
  ${quiz('guess2','Q2. 학생들은 어느 방법을 가장 선호했을까요?',
    [{v:'ai',t:'🤖 AI 챗봇'},{v:'note',t:'✍️ 노트 쓰기'}],
    ['ai'],
    '<b>AI 챗봇!</b> 대부분의 학생이 노트보다 AI를 더 좋아했고, <b>더 도움이 된다고 느꼈습니다.</b>')}
</div>
<button class="btn primary reveal-btn" data-reveal="k-conclusion">결론 보기 ›</button>
<div class="reveal-box" id="k-conclusion">
  <div class="callout">도움받은 느낌 ≠ 실제 이해
  <span class="sub">연구진 결론: 노트 쓰기는 인지적 참여와 장기 이해를 높이고, AI는 첫 이해와 흥미를 도울 수 있다.</span></div>
</div>
<div class="btn-row mt">${linkBtn(REFS.kreijkesPdf.u,'논문 원문 읽기','ghost')} ${linkBtn(REFS.kreijkes.u,'Microsoft Research 소개','ghost')}</div>`},

/* Facilitate */
{sec:'s1', nav:'AI의 역할: Replace가 아니라 Facilitate', html:`
<div class="kicker"><span class="chip">1. 도입</span></div>
<h2>AI의 역할을 먼저 정합니다</h2>
<div class="big-q">AI는 읽기를 <span style="color:var(--red);text-decoration:line-through">대신하지</span> 않는다.<br>읽기를 <span style="color:var(--blue)">촉진(facilitate)</span>한다.</div>
<table class="mac">
  <tr><th class="bad">AI가 대신 읽기 (Replace)</th><th class="good">AI가 읽기를 촉진 (Facilitate)</th></tr>
  <tr><td>요약을 준다</td><td>배경지식을 깨운다</td></tr>
  <tr><td>해석을 준다</td><td>질문하고 되묻는다</td></tr>
  <tr><td>감상을 써 준다</td><td>다른 관점을 맞세운다</td></tr>
  <tr><td>학생은 결과를 받는다</td><td><b>학생이 읽는 과정을 계속 수행한다</b></td></tr>
</table>
<div class="callout blue">AI는 문턱을 낮추고, 생각은 학생이 한다.
<span class="sub" style="color:rgba(255,255,255,.85)">이 기준으로 세 가지 사례를 봅니다. ① 교사의 수업 준비 ② 학생의 읽기 지원 ③ 학생의 해석 끌어내기</span></div>`},

/* NotebookLM */
{sec:'s2', nav:'NotebookLM으로 읽기 수업 준비하기', html:`
<div class="kicker"><span class="chip">2. 사례 ①</span><span class="chip green">Facilitate: 교사의 판단을 돕는다</span></div>
<h2>NotebookLM으로 읽기 수업 준비하기</h2>
<p class="lead">업로드한 소스에만 근거해 답하고 근거 위치를 보여줍니다. 환각이 적고 검증이 쉬워요.</p>
<div class="flow">
  <div class="node"><b>(1) 리소스 입력</b><span>읽기 자료, 성취기준 및 평가기준</span></div>
  <div class="arrow">›</div>
  <div class="node"><b>(2) 배경자료 조사·학습</b><span>읽기 배경자료를 조사하고 교사가 먼저 학습</span></div>
  <div class="arrow">›</div>
  <div class="node"><b>(3) 2차 저작물 생성</b><span>생성한 자료를 수업과 평가에 활용</span></div>
</div>
<div class="shot-wrap mt">
  <img class="shot" src="${esc(CONFIG.NOTEBOOK_IMAGE)}" alt="NotebookLM 노트북 화면" onerror="this.parentElement.classList.add('missing')">
  <div class="placeholder">🖼 <b>노트북 캡처 이미지</b> — 저장소의 <code>${esc(CONFIG.NOTEBOOK_IMAGE)}</code> 경로에 캡처 이미지를 넣으면 이 자리에 표시됩니다.</div>
</div>
<div class="btn-row mt">
  ${linkBtn(CONFIG.NOTEBOOK_LINK,'📓 내 노트북 열어보기')}
  ${linkBtn(CONFIG.PADLET_BIGDATA,'🧪 실제 수업 적용 · 패들렛 샌드박스','ghost')}
</div>`},

/* 캡스톤 ① */
{sec:'s3', nav:'적응형 독해 진단·비계 시스템', html:`
<div class="kicker"><span class="chip">3. 사례 ②</span><span class="chip green">Facilitate: 학생이 스스로 읽어내게 돕는다</span></div>
<h2>AI 기반 적응형 독해 진단·비계 시스템</h2>

function refItem(k){
  const r = REFS[k];
  return `<a class="ref" href="${esc(r.u)}" target="_blank" rel="noopener"><span class="go">열기 ↗</span><b>${esc(r.t)}</b><span>${esc(r.d)}</span></a>`;
}

/* =========================================================
   렌더링 & 내비게이션
   ========================================================= */
const $ = s => document.querySelector(s);
const stage = $('#stage'), sidebar = $('#sidebar');
const slideId = (s,i) => s.id || 'slide-'+i;
let cur = 0, mode = 'present';

stage.innerHTML = SLIDES.map((s,i)=>`<section class="slide" id="${slideId(s,i)}" data-i="${i}">${s.html}</section>`).join('');
sidebar.innerHTML = SECTIONS.map(sec=>{
  const items = SLIDES.map((s,i)=>({s,i})).filter(o=>o.s.sec===sec.id);
  return `<div class="side-group"><div class="side-head"><span>${sec.name}</span><span class="min">${sec.min}</span></div>
    ${items.map(o=>`<div class="side-item" data-go="${o.i}"><span class="num">${o.i}</span><span>${esc(o.s.nav)}</span></div>`).join('')}</div>`;
}).join('');

const participantURL = () => pageURL() + '?mode=doc';
const qrSrc = (size) => { try{ const q = qrcode(0,'M'); q.addData(participantURL()); q.make(); const n=q.getModuleCount(); return q.createDataURL(Math.max(2,Math.floor(size/(n+2))), Math.floor(size/(n+2))); }catch(_){ return `https://api.qrserver.com/v1/create-qr-code/?size=${size}x${size}&margin=0&data=${encodeURIComponent(participantURL())}`; } };
document.querySelectorAll('[data-qr]').forEach(img=>img.src = qrSrc(300));

function markNav(){
  const sec = SECTIONS.find(s=>s.id===SLIDES[cur].sec);
  $('#winTitle').textContent = (sec && sec.id!=='start' ? sec.name + ' — ' : '') + SLIDES[cur].nav;
  document.querySelectorAll('.side-item').forEach(el=>el.classList.toggle('on', +el.dataset.go===cur));
  $('#counter').textContent = `${cur} / ${SLIDES.length-1}`;
  $('#bar').style.width = (cur/(SLIDES.length-1)*100)+'%';
}
function go(i, scroll=true){
  cur = Math.max(0, Math.min(SLIDES.length-1, i));
  document.querySelectorAll('.slide').forEach((el,k)=>el.classList.toggle('active', k===cur));
  markNav();
  $('#prev').disabled = cur===0;
  $('#next').disabled = cur===SLIDES.length-1;
  history.replaceState(null,'', location.pathname + location.search + '#' + slideId(SLIDES[cur],cur));
  if(mode==='present'){ stage.scrollTop = 0; }
  else if(scroll){ document.querySelectorAll('.slide')[cur].scrollIntoView({behavior:'smooth'}); }
  const side = document.querySelector('.side-item.on'); if(side) side.scrollIntoView({block:'nearest'});
}
function setMode(m){
  mode = m;
  document.body.classList.toggle('present', m==='present');
  document.body.classList.toggle('doc', m==='doc');
  $('#mPresent').classList.toggle('on', m==='present');
  $('#mDoc').classList.toggle('on', m==='doc');
  go(cur, true);
}

sidebar.addEventListener('click', e=>{
  const it = e.target.closest('[data-go]'); if(!it) return;
  go(+it.dataset.go); sidebar.classList.remove('open');
});
$('#prev').onclick = ()=>go(cur-1);
$('#next').onclick = ()=>go(cur+1);
$('#mPresent').onclick = ()=>setMode('present');
$('#mDoc').onclick = ()=>setMode('doc');
$('#menuBtn').onclick = ()=>sidebar.classList.toggle('open');
$('#fsBtn').onclick = toggleFS;
function toggleFS(){
  if(!document.fullscreenElement){ document.documentElement.requestFullscreen?.(); }
  else { document.exitFullscreen?.(); }
}
document.addEventListener('fullscreenchange', ()=>document.body.classList.toggle('fs', !!document.fullscreenElement));

/* 메뉴바·타이틀바 동작 */
document.addEventListener('click', e=>{
  const b = e.target.closest('[data-act]'); if(!b) return;
  const act = b.dataset.act;
  if(act==='present') setMode('present');
  if(act==='doc') setMode('doc');
  if(act==='ref') go(SLIDES.findIndex(s=>s.id==='ref'));
  if(act==='qr') openQR();
  if(act==='pdf') savePDF();
});

/* QR 모달 */
function openQR(){
  $('#qrImg').src = qrSrc(500);
  $('#qrUrl').textContent = participantURL();
  $('#qrModal').classList.add('show');
}
$('#qrClose').onclick = ()=>$('#qrModal').classList.remove('show');
$('#qrModal').onclick = e=>{ if(e.target.id==='qrModal') $('#qrModal').classList.remove('show'); };
$('#qrCopy').onclick = async ()=>{ try{ await navigator.clipboard.writeText(participantURL()); toast('주소를 복사했어요'); }catch(_){ toast(participantURL()); } };

/* PDF 저장: 인쇄 대화상자에서 'PDF로 저장' */
function savePDF(){
  const prev = mode;
  if(mode!=='doc') setMode('doc');
  toast('인쇄 창에서 대상을 ‘PDF로 저장’으로 선택하세요');
  setTimeout(()=>{
    window.print();
    if(prev!=='doc') setMode(prev);
  }, 400);
}

document.addEventListener('keydown', e=>{
  if(e.target.matches('input,textarea')) return;
  if(e.key==='Escape') $('#qrModal').classList.remove('show');
  if(mode==='present' && ['ArrowRight','PageDown',' '].includes(e.key)){ e.preventDefault(); go(cur+1); }
  if(mode==='present' && ['ArrowLeft','PageUp'].includes(e.key)){ e.preventDefault(); go(cur-1); }
  if(e.key==='f'||e.key==='F') toggleFS();
  if(e.key==='d'||e.key==='D') setMode(mode==='present'?'doc':'present');
});

/* 자료 모드: 스크롤 위치에 따라 사이드바 표시 */
const io = new IntersectionObserver(ents=>{
  if(mode!=='doc') return;
  ents.forEach(en=>{ if(en.isIntersecting){ const i=+en.target.dataset.i; if(i!==cur){ cur=i; markNav(); } } });
},{root: window.innerWidth<760 ? null : stage, threshold:.3});
document.querySelectorAll('.slide').forEach(el=>io.observe(el));

/* 결론 보기 */
stage.addEventListener('click', e=>{
  const b = e.target.closest('[data-reveal]'); if(!b) return;
  const box = document.getElementById(b.dataset.reveal);
  const show = !box.classList.contains('show');
  box.classList.toggle('show', show);
  b.textContent = show ? '결론 숨기기' : '결론 보기 ›';
});

function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),2200); }

/* 시계 & 타이머 */
function tickClock(){ $('#clock').textContent = new Date().toLocaleTimeString('ko-KR',{hour:'numeric',minute:'2-digit'}); }
tickClock(); setInterval(tickClock, 15000);
let tStart=null, tAcc=0, tInt=null;
function fmt(ms){ const s=Math.floor(ms/1000); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
function drawTimer(){ const ms = tAcc + (tStart? Date.now()-tStart:0); $('#timer').textContent = (tStart?'⏱ ':'⏸ ')+fmt(ms) + ' / 60:00'; $('#timer').style.color = ms>3600000?'var(--red)':''; }
$('#timer').onclick = ()=>{ if(tStart){ tAcc += Date.now()-tStart; tStart=null; clearInterval(tInt);} else { tStart=Date.now(); tInt=setInterval(drawTimer,1000);} drawTimer(); };
$('#timer').ondblclick = ()=>{ tStart=null; tAcc=0; clearInterval(tInt); drawTimer(); };
drawTimer();

/* =========================================================
   실시간 응답 보드 & 추측 퀴즈
   ========================================================= */
const LIVE = !!CONFIG.SCRIPT_URL;
const BOARD_IDS = ['opening','guess1','guess2','practice','qna'];
const localStore = Object.fromEntries(BOARD_IDS.map(k=>[k,[]]));
const dataCache = Object.fromEntries(BOARD_IDS.map(k=>[k,[]]));
const seen = {};

function renderBoard(id, items){
  dataCache[id] = items;
  document.querySelectorAll(`[data-board="${id}"]`).forEach(b=>{
    const notes = b.querySelector('.notes');
    b.querySelector('.count').textContent = items.length + '개';
    if(!items.length){ notes.innerHTML = '<div class="empty">첫 응답을 기다리는 중이에요</div>'; return; }
    if(items.length===seen[id]) return;
    notes.innerHTML = items.slice().reverse().map(it=>`<div class="note">${esc(it.text)}${it.name?`<span class="who">— ${esc(it.name)}</span>`:''}</div>`).join('');
  });
  seen[id] = items.length;
  renderQuiz(id);
}
function renderQuiz(id){
  const q = document.querySelector(`[data-quiz="${id}"]`); if(!q) return;
  const items = dataCache[id] || [];
  const total = items.length;
  q.querySelectorAll('.opt').forEach(o=>{
    const n = items.filter(it=>it.text===o.dataset.v).length;
    const p = total ? Math.round(n/total*100) : 0;
    o.querySelector('.pct').textContent = `${p}% · ${n}명`;
    o.querySelector('.bar').style.width = q.classList.contains('revealed') ? p+'%' : '0';
  });
  q.querySelector('.votes').textContent = total ? `${total}명이 추측했어요` : '아직 응답이 없어요 · 먼저 추측해 보세요';
}
function setStatus(ok, msg){
  document.querySelectorAll('.board').forEach(b=>{
    b.querySelector('.dot').classList.toggle('live', ok);
    b.querySelector('.status').textContent = msg;
  });
  $('#liveMenu').textContent = ok ? '● 실시간 연결됨' : '○ ' + (LIVE?'연결 확인 중':'체험 모드');
}
async function poll(){
  if(!LIVE) return;
  try{
    const r = await fetch(CONFIG.SCRIPT_URL + '?action=list&_=' + Date.now());
    const j = await r.json();
    if(!j.ok) throw new Error('bad');
    Object.keys(j.boards||{}).forEach(k=>renderBoard(k, j.boards[k]));
    setStatus(true, '실시간 연결됨 · 5초마다 새로고침');
  }catch(err){ setStatus(false, '연결 오류 · 다시 시도 중'); }
}
async function send(board, name, text){
  if(LIVE){
    await fetch(CONFIG.SCRIPT_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({board, name, text})});
    await poll();
  } else {
    localStore[board].push({t:Date.now(), name, text});
    renderBoard(board, localStore[board]);
  }
}

document.addEventListener('submit', async e=>{
  const form = e.target.closest('.board-form'); if(!form) return;
  e.preventDefault();
  const id = form.closest('[data-board]').dataset.board;
  const name = form.querySelector('.name').value.trim();
  const textEl = form.querySelector('.text');
  const text = textEl.value.trim();
  if(!text) return;
  const btn = form.querySelector('button'); btn.disabled = true;
  try{ await send(id, name, text); textEl.value=''; toast('응답을 보냈어요'); }
  catch(err){ toast('전송에 실패했어요. 다시 시도해 주세요'); }
  btn.disabled = false;
});

/* 퀴즈: 한 사람당 한 번 투표, 정답 공개 */
const voted = {};
stage.addEventListener('click', async e=>{
  const opt = e.target.closest('.quiz .opt');
  if(opt){
    const q = opt.closest('.quiz'), id = q.dataset.quiz;
    if(voted[id]){ toast('이미 추측을 보냈어요'); return; }
    voted[id] = opt.dataset.v;
    opt.classList.add('mine');
    try{ await send(id, '', opt.dataset.v); toast('추측을 보냈어요'); }
    catch(_){ toast('전송에 실패했어요'); voted[id]=null; opt.classList.remove('mine'); }
    return;
  }
  const rv = e.target.closest('[data-reveal-quiz]');
  if(rv){
    const q = rv.closest('.quiz');
    const correct = q.dataset.correct.split(',');
    q.classList.toggle('revealed');
    q.querySelectorAll('.opt').forEach(o=>o.classList.toggle('correct', correct.includes(o.dataset.v)));
    rv.textContent = q.classList.contains('revealed') ? '정답 숨기기' : '정답 공개';
    renderQuiz(q.dataset.quiz);
  }
});

if(LIVE){ setStatus(false,'연결 중…'); poll(); setInterval(poll, CONFIG.POLL_MS); }
else { setStatus(false, '체험 모드 · CONFIG.SCRIPT_URL을 넣으면 실시간 공유'); }

/* 인쇄(PDF) 시 퀴즈 정답 표시 */
window.addEventListener('beforeprint', ()=>{
  document.querySelectorAll('.quiz').forEach(q=>{
    const correct = q.dataset.correct.split(',');
    q.classList.add('revealed');
    q.querySelectorAll('.opt').forEach(o=>o.classList.toggle('correct', correct.includes(o.dataset.v)));
    renderQuiz(q.dataset.quiz);
  });
});

/* 시작 */
const params = new URLSearchParams(location.search);
const startIdx = SLIDES.findIndex((s,k)=>slideId(s,k)===location.hash.slice(1));
if(startIdx>=0) cur = startIdx;
setMode(params.get('mode')==='doc' || window.innerWidth<760 ? 'doc' : 'present');

</script>
</body>
</html>
