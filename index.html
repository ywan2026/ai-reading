<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>대신 읽어주는 AI에서 읽기를 돕는 AI로 · AI와 독서교육</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* ============ 토큰 ============ */
:root{
  --accent:#5856d6;
  --accent-2:#7b5cd6;
  --accent-soft:rgba(88,86,214,.10);
  --accent-line:rgba(88,86,214,.16);
  --good:#1f9d4c; --good-bg:#effaf2; --good-line:rgba(31,157,76,.22);
  --bad:#d63a2f;  --bad-bg:#fff2f1;  --bad-line:rgba(214,58,47,.20);
  --text:#1d1d2b; --sub:#6b6b80; --muted:#9a9ab0;
  --card:#ffffff; --card-line:rgba(88,86,214,.13);
  --surface:linear-gradient(160deg,#ffffff 0%,#f7f6ff 55%,#fdf4f8 100%);
  --radius:14px;
  --shadow-win:0 30px 80px rgba(20,16,60,.30),0 0 0 .5px rgba(0,0,0,.2);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",sans-serif;
  color:var(--text);
  background:
    radial-gradient(1200px 800px at 10% 10%,#6e8efb 0%,transparent 60%),
    radial-gradient(900px 700px at 90% 20%,#c471ed 0%,transparent 55%),
    radial-gradient(1000px 900px at 60% 100%,#f7797d 0%,transparent 60%),
    #2b2d5a;
  overflow:hidden;-webkit-font-smoothing:antialiased;
}
a{color:var(--accent);text-decoration:none}

/* ============ 메뉴바 & 창 ============ */
.menubar{position:fixed;top:0;left:0;right:0;height:28px;z-index:20;display:flex;align-items:center;gap:6px;padding:0 14px;
  background:rgba(255,255,255,.35);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);font-size:13px;font-weight:500}
.menubar b{font-weight:700;margin:0 8px 0 6px}
.menubar .right{margin-left:auto;display:flex;gap:14px;align-items:center}
.menubar .clock{font-variant-numeric:tabular-nums}
.mb-btn{border:0;background:transparent;font:inherit;font-size:13px;font-weight:600;color:#1d1d1f;cursor:pointer;padding:3px 9px;border-radius:5px}
.mb-btn:hover{background:rgba(0,0,0,.08)}

.window{position:fixed;top:40px;left:16px;right:16px;bottom:16px;display:grid;grid-template-columns:250px 1fr;grid-template-rows:46px 1fr 50px;
  background:rgba(255,255,255,.62);border-radius:12px;box-shadow:var(--shadow-win);
  backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);overflow:hidden}
.titlebar{grid-column:1/-1;grid-row:1;display:flex;align-items:center;gap:12px;padding:0 14px;border-bottom:1px solid rgba(0,0,0,.08);background:rgba(248,247,252,.75)}
.lights{display:flex;gap:8px}
.lights span{width:12px;height:12px;border-radius:50%;display:block;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.15)}
.lights .r{background:#ff5f57}.lights .y{background:#febc2e}.lights .g{background:#28c840}
.titlebar .title{flex:1;text-align:center;font-size:13px;font-weight:600;color:#3a3a4c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:flex;background:rgba(0,0,0,.06);border-radius:8px;padding:2px;flex:none}
.seg button{border:0;background:transparent;font:inherit;font-size:12px;font-weight:600;padding:5px 12px;border-radius:6px;color:#3a3a4c;cursor:pointer}
.seg button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.15);color:#000}
.icon-btn{border:0;background:transparent;font-size:15px;cursor:pointer;padding:5px 7px;border-radius:6px;color:#3a3a4c;flex:none}
.icon-btn:hover{background:rgba(0,0,0,.06)}
#menuBtn{display:none}

.sidebar{grid-column:1;grid-row:2/4;background:rgba(244,243,250,.7);border-right:1px solid rgba(0,0,0,.07);overflow-y:auto;padding:12px 10px 20px}
.toc-group{margin-bottom:12px}
.toc-head{font-size:11px;font-weight:700;color:var(--sub);padding:6px 10px 4px;display:flex;justify-content:space-between}
.toc-head .min{font-weight:600;color:var(--muted)}
.toc-item{display:flex;align-items:flex-start;gap:8px;padding:6px 10px;border-radius:7px;font-size:13px;cursor:pointer;line-height:1.4}
.toc-item:hover{background:rgba(88,86,214,.07)}
.toc-item.on{background:var(--accent);color:#fff}
.toc-item .num{font-size:11px;color:var(--muted);width:16px;text-align:right;flex:none;margin-top:1px}
.toc-item.on .num{color:rgba(255,255,255,.8)}

.stage{grid-column:2;grid-row:2;position:relative;overflow:hidden}
.toolbar{grid-column:2;grid-row:3;display:flex;align-items:center;gap:12px;padding:0 16px;border-top:1px solid rgba(0,0,0,.07);background:rgba(248,247,252,.75);font-size:13px}
.toolbar .nav{display:flex;gap:6px}
.btn{border:0;font:inherit;font-size:13px;font-weight:600;cursor:pointer;padding:7px 14px;border-radius:8px;background:#fff;color:#1d1d2b;box-shadow:0 0 0 .5px rgba(0,0,0,.15),0 1px 2px rgba(0,0,0,.08)}
.btn:hover{background:#f6f6fb}
.btn.primary{background:var(--accent);color:#fff;box-shadow:none}
.btn.primary:hover{background:#4b49c8}
.btn:disabled{opacity:.45;cursor:default}
.progress{flex:1;height:5px;background:rgba(0,0,0,.08);border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .3s}
.counter{font-variant-numeric:tabular-nums;color:var(--sub);min-width:58px;text-align:right}
.timer{font-variant-numeric:tabular-nums;color:var(--sub);cursor:pointer;padding:4px 8px;border-radius:6px}
.timer:hover{background:rgba(0,0,0,.05)}

/* ============ 슬라이드 캔버스 (16:9, 1280×720) ============ */
body.present .stage{display:flex;align-items:center;justify-content:center}
body.doc .stage{overflow-y:auto;padding:28px}
.frame{position:relative;flex:none;width:calc(1280px * var(--s,1));height:calc(720px * var(--s,1))}
body.present .frame{display:none}
body.present .frame.active{display:block}
body.doc .frame{margin:0 auto 28px}
.slide{position:absolute;top:0;left:0;width:1280px;height:720px;transform:scale(var(--s,1));transform-origin:0 0;
  padding:46px 64px 40px;display:flex;flex-direction:column;overflow:hidden;
  background:var(--surface);border-radius:14px;box-shadow:0 0 0 .5px rgba(40,30,110,.10),0 10px 40px rgba(40,30,110,.14)}
body.present .frame.active .slide{animation:fade .3s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.fill{flex:1;min-height:0;display:flex;flex-direction:column}

/* ============ 타이포 ============ */
.kicker{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;padding:4px 11px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.chip.gray{background:rgba(0,0,0,.05);color:#55556a}
.chip.green{background:var(--good-bg);color:var(--good);box-shadow:inset 0 0 0 1px var(--good-line)}
.chip.red{background:var(--bad-bg);color:var(--bad);box-shadow:inset 0 0 0 1px var(--bad-line)}
h1{font-size:56px;font-weight:800;letter-spacing:-.03em;line-height:1.15}
h2{font-size:34px;font-weight:800;letter-spacing:-.025em;line-height:1.25;margin-bottom:6px}
h3{font-size:17px;font-weight:700;letter-spacing:-.01em;margin-bottom:6px}
.lead{font-size:17px;color:var(--sub);line-height:1.55;margin-bottom:18px}
p,li{font-size:15.5px;line-height:1.6}
.sm{font-size:14px !important}
.xs{font-size:12.5px !important}
.muted{color:var(--sub)}
ul.clean{list-style:none}
ul.clean li{position:relative;padding-left:16px;margin:3px 0}
ul.clean li::before{content:"";position:absolute;left:2px;top:.7em;width:6px;height:6px;border-radius:50%;background:#c4c2e6}
.big-q{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.4;margin:4px 0 18px}
.mt{margin-top:16px}.mt-s{margin-top:8px}.mt-l{margin-top:22px}
.src{margin-top:auto;padding-top:10px;font-size:12px;color:var(--muted);line-height:1.6}
.src a{margin-right:9px;color:#7a78c9}

/* ============ 레이아웃 ============ */
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.g5{grid-template-columns:repeat(5,1fr)}
.split{display:grid;gap:18px;align-items:stretch}

/* ============ 카드 (통일) ============ */
.card{background:var(--card);border-radius:var(--radius);padding:16px 18px;box-shadow:0 0 0 1px var(--card-line),0 2px 8px rgba(60,50,140,.05)}
.card.good{background:var(--good-bg);box-shadow:0 0 0 1px var(--good-line)}
.card.bad{background:var(--bad-bg);box-shadow:0 0 0 1px var(--bad-line)}
.card.tint{background:linear-gradient(160deg,#f4f3ff,#fbf7ff);box-shadow:0 0 0 1px var(--accent-line)}
.card .label{font-size:12px;font-weight:700;color:var(--sub);margin-bottom:5px;letter-spacing:.02em}
.card.good .label{color:var(--good)} .card.bad .label{color:var(--bad)}
.stat{font-size:54px;font-weight:800;letter-spacing:-.04em;line-height:1}
.stat small{font-size:.4em;font-weight:700;margin-left:3px;color:var(--sub)}
.callout{padding:16px 22px;border-radius:var(--radius);color:#fff;font-size:20px;font-weight:700;line-height:1.5;letter-spacing:-.01em;
  background:linear-gradient(135deg,#3f3d9e 0%,#6a4bc4 60%,#a44fb0 100%);box-shadow:0 8px 24px rgba(70,50,170,.22)}
.callout .sub{display:block;font-size:14px;font-weight:500;color:rgba(255,255,255,.82);margin-top:4px}

table.mac{width:100%;border-collapse:separate;border-spacing:0;background:#fff;border-radius:var(--radius);overflow:hidden;box-shadow:0 0 0 1px var(--card-line)}
table.mac th{font-size:14px;font-weight:700;text-align:left;padding:11px 18px;background:#f6f5fd;border-bottom:1px solid var(--card-line)}
table.mac td{font-size:15.5px;padding:10px 18px;border-bottom:1px solid rgba(88,86,214,.08);vertical-align:top}
table.mac tr:last-child td{border-bottom:0}
table.mac th.bad{color:var(--bad)} table.mac th.good{color:var(--good)}

.steps{counter-reset:s;display:grid;gap:9px;align-content:start}
.step{display:flex;gap:13px;align-items:flex-start;background:#fff;border-radius:12px;padding:12px 16px;box-shadow:0 0 0 1px var(--card-line)}
.step::before{counter-increment:s;content:counter(s);flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;margin-top:1px}
.step b{display:block;font-size:15.5px;margin-bottom:1px}
.step span{font-size:14px;color:#4a4a5e;line-height:1.5}
.steps.row{grid-auto-flow:column;grid-auto-columns:1fr}

.flow{display:flex;align-items:stretch;gap:6px}
.flow .node{flex:1;background:#fff;border-radius:12px;padding:12px 14px;box-shadow:0 0 0 1px var(--card-line)}
.flow .node b{display:block;font-size:15px;margin-bottom:2px}
.flow .node span{font-size:13.5px;color:#4a4a5e;line-height:1.45}
.flow .arrow{display:flex;align-items:center;color:#c4c2e6;font-size:20px;font-weight:700}

.timeline{position:relative;padding-left:20px}
.timeline::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:#e4e2f4}
.tl{position:relative;margin-bottom:8px}
.tl::before{content:"";position:absolute;left:-20px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--bad);box-shadow:0 0 0 3px #fff}
.tl .when{font-size:12px;font-weight:700;color:var(--bad)}
.tl .what{font-size:14.5px;line-height:1.5}

.linkbtn{display:inline-flex;align-items:center;gap:8px;padding:10px 17px;border-radius:10px;background:var(--accent);color:#fff !important;font-weight:700;font-size:15px}
.linkbtn:hover{background:#4b49c8}
.linkbtn.ghost{background:#fff;color:var(--accent) !important;box-shadow:0 0 0 1px rgba(88,86,214,.35)}
.linkbtn.big{padding:15px 26px;font-size:18px;border-radius:12px}
.linkbtn.off{background:#e8e7f2;color:#8e8ea0 !important;cursor:default}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.title-wrap{display:grid;grid-template-columns:1fr auto;gap:30px;align-items:center;flex:1}
.qr{background:#fff;padding:12px;border-radius:14px;box-shadow:0 0 0 1px var(--card-line);text-align:center}
.qr img{display:block;width:160px;height:160px;image-rendering:pixelated}
.qr small{display:block;font-size:11.5px;color:var(--sub);margin-top:6px}
.agenda .card{padding:13px 15px}
.agenda .n{font-size:12px;font-weight:800;color:var(--accent)}
.agenda .t{font-size:15px;font-weight:700;margin-top:2px}
.agenda .m{font-size:12.5px;color:var(--sub)}

.shot{width:100%;border-radius:12px;box-shadow:0 0 0 1px var(--card-line),0 8px 24px rgba(40,30,110,.12);display:block;background:#fff}
.shot-fit{width:100%;height:100%;object-fit:contain;object-position:top center;border-radius:12px;display:block}
.shot-wrap{position:relative}
.shot-wrap .placeholder{display:none}
.shot-wrap.missing img{display:none}
.shot-wrap.missing .placeholder{display:flex}
.placeholder{border:2px dashed #c9c7e8;border-radius:var(--radius);padding:18px 20px;color:var(--sub);background:rgba(255,255,255,.6);align-items:center;justify-content:center;text-align:center;min-height:200px;font-size:15px;line-height:1.6}
.cap{font-size:12.5px;color:var(--sub);margin-top:6px}

/* 참고자료 */
.refs{columns:2;column-gap:28px}
.ref-group{break-inside:avoid;margin-bottom:12px}
.ref-group h3{font-size:13.5px;color:var(--sub);margin-bottom:5px}
.ref{display:flex;gap:8px;align-items:baseline;padding:5px 10px;border-radius:8px;color:var(--text) !important;font-size:13px;line-height:1.4}
.ref:hover{background:var(--accent-soft)}
.ref b{font-weight:600}
.ref span{color:var(--muted);font-size:12px}
.ref .go{color:var(--accent);font-weight:700;flex:none}

/* ============ 차트 ============ */
.chart-card{background:#fff;border-radius:var(--radius);padding:16px 18px 12px;box-shadow:0 0 0 1px var(--card-line)}
.chart-card h3{font-size:15.5px;margin-bottom:1px}
.chart-card .ccap{font-size:12.5px;color:var(--sub);margin-bottom:8px}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart .grid-l{stroke:#ecebf6;stroke-width:1}
.chart .axis-t{font-size:12px;fill:#9a9ab0}
.chart .val-t{font-size:13px;font-weight:700;fill:#1d1d2b}
.chart .hit{fill:transparent;cursor:pointer}
.waffle{display:grid;grid-template-columns:repeat(25,1fr);gap:3px;margin-top:8px}
.waffle i{aspect-ratio:1;border-radius:3px;background:#ecebf6}
.waffle i.on{background:var(--bad)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:#55556a;margin-top:8px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--c)}
.hbar{display:grid;grid-template-columns:110px 1fr 42px;align-items:center;gap:10px;margin:6px 0;font-size:14px}
.hbar .track{height:13px;background:#f0eff8;border-radius:4px;overflow:hidden}
.hbar .fill{height:100%;background:var(--accent);border-radius:0 4px 4px 0}
.hbar b{font-variant-numeric:tabular-nums;text-align:right}
.dumb{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center;font-size:13.5px;margin:12px 0 4px}
.dumb .line{position:relative;height:22px}
.dumb .line::before{content:"";position:absolute;left:0;right:0;top:10px;height:2px;background:#f0eff8}
.dumb .seg{position:absolute;top:10px;height:2px;background:#c9c7e8}
.dumb .p{position:absolute;top:4px;width:14px;height:14px;border-radius:50%;transform:translateX(-50%);box-shadow:0 0 0 2px #fff}
.dumb .p em{position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-style:normal;font-size:11.5px;font-weight:700;white-space:nowrap}

/* ============ 퀴즈 ============ */
.quiz{background:#fff;border-radius:var(--radius);padding:16px 18px;box-shadow:0 0 0 1px var(--card-line);display:flex;flex-direction:column}
.quiz .q{font-size:17px;font-weight:800;margin-bottom:10px;letter-spacing:-.01em}
.quiz .opts{display:grid;gap:7px}
.quiz .opt{position:relative;display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;font:inherit;font-size:15px;font-weight:600;padding:10px 14px;border-radius:10px;background:#f4f3fa;cursor:pointer;overflow:hidden;color:#1d1d2b}
.quiz .opt:hover{background:#ebeaf6}
.quiz .opt.mine{box-shadow:0 0 0 2px var(--accent);background:#f1f0ff}
.quiz .opt .bar{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(88,86,214,.13);transition:width .5s}
.quiz .opt .lbl{position:relative;flex:1}
.quiz .opt .pct{position:relative;font-size:12.5px;color:var(--sub);font-variant-numeric:tabular-nums;display:none}
.quiz.revealed .opt .pct{display:inline}
.quiz.revealed .opt.correct{background:var(--good-bg)}
.quiz.revealed .opt.correct .bar{background:rgba(31,157,76,.18)}
.quiz.revealed .opt.correct .lbl::after{content:"  ✓ 정답";color:var(--good);font-weight:800}
.quiz .qfoot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:12.5px;color:var(--sub);gap:10px}
.quiz .answer{display:none;margin-top:10px;padding:10px 13px;border-radius:10px;background:var(--good-bg);font-size:14px;line-height:1.55}
.quiz.revealed .answer{display:block}
.reveal-row{margin-top:14px;min-height:62px;display:flex;align-items:center;gap:14px}
.reveal-box{display:none;flex:1}
.reveal-box.show{display:block;animation:fade .4s ease}

/* ============ 응답 보드 ============ */
.board{background:rgba(255,255,255,.75);border-radius:var(--radius);padding:14px;box-shadow:0 0 0 1px var(--card-line);display:flex;flex-direction:column;min-height:0}
.board.grow{flex:1}
.board-form{display:flex;gap:8px}
.board-form input{font:inherit;font-size:15px;padding:10px 13px;border-radius:10px;border:0;background:#fff;box-shadow:0 0 0 1px rgba(88,86,214,.2);outline:none;min-width:0}
.board-form input:focus{box-shadow:0 0 0 3px rgba(88,86,214,.3)}
.board-form .name{width:140px;flex:none}
.board-form .text{flex:1}
.board-meta{display:flex;justify-content:space-between;align-items:center;margin:10px 2px 8px;font-size:12px;color:var(--sub)}
.board-meta .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#c9c7e8;margin-right:6px;vertical-align:1px}
.board-meta .dot.live{background:#30d158;box-shadow:0 0 0 3px rgba(48,209,88,.25)}
.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:9px;overflow-y:auto;padding:2px;flex:1;min-height:60px;align-content:start}
.note{background:#f1efff;border-radius:10px;padding:11px 13px;font-size:14.5px;line-height:1.5;box-shadow:0 1px 2px rgba(60,50,140,.08);animation:pop .3s ease;word-break:break-word}
.note:nth-child(4n+2){background:#fdeef5}.note:nth-child(4n+3){background:#eaf6ff}.note:nth-child(4n+4){background:#fff6e0}
.note .who{display:block;font-size:12px;color:var(--sub);margin-top:5px;font-weight:600}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);font-size:14px;padding:18px}

/* ============ 토스트·모달·목차 시트 ============ */
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%) translateY(20px);opacity:0;background:rgba(30,28,50,.92);color:#fff;font-size:14px;font-weight:600;padding:10px 18px;border-radius:10px;transition:.25s;z-index:80;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}
.modal{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:rgba(20,16,50,.38);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.modal.show{display:flex}
.modal .box{background:#fff;border-radius:16px;padding:24px 28px;text-align:center;box-shadow:var(--shadow-win);max-width:92vw;animation:pop .25s ease}
.modal .box img{width:min(320px,68vw);height:min(320px,68vw);display:block;margin:12px auto;image-rendering:pixelated}
.modal .box .u{font-size:13px;color:var(--sub);word-break:break-all;max-width:360px;margin:0 auto 14px}
.sheet{position:fixed;inset:0;z-index:70;display:none;background:rgba(20,16,50,.38);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.sheet.show{display:block}
.sheet .panel{position:absolute;left:12px;right:12px;bottom:12px;max-height:72vh;background:#fff;border-radius:18px;box-shadow:var(--shadow-win);display:flex;flex-direction:column;animation:up .25s ease}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.sheet .head{display:flex;justify-content:space-between;align-items:center;padding:14px 18px 8px;font-weight:800;font-size:16px}
.sheet .list{overflow-y:auto;padding:0 10px 14px}
.toc-fab{display:none}

/* ============ 전체화면 ============ */
body.fs .menubar,body.fs .titlebar,body.fs .sidebar{display:none}
body.fs .window{top:0;left:0;right:0;bottom:0;border-radius:0;grid-template-columns:1fr;grid-template-rows:1fr 44px;background:#15142a;backdrop-filter:none}
body.fs .stage{grid-column:1;grid-row:1}
body.fs .toolbar{grid-column:1;grid-row:2;background:#1d1c34;border-top-color:rgba(255,255,255,.06);color:#aaa;opacity:.35;transition:opacity .2s}
body.fs .toolbar:hover{opacity:1}
body.fs .slide{border-radius:0}

/* ============ 모바일 (흐르는 레이아웃) ============ */
@media (max-width:760px){
  body{overflow:auto}
  .menubar,.lights,.sidebar,#fsBtn{display:none !important}
  .window{position:static;display:block;min-height:100vh;border-radius:0;box-shadow:none;overflow:visible;background:transparent;backdrop-filter:none}
  .titlebar{position:sticky;top:0;z-index:30;gap:8px;padding:0 10px;height:50px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);background:rgba(248,247,252,.92)}
  .titlebar .title{text-align:left;font-size:13px}
  #menuBtn{display:block}
  body .stage,body.doc .stage{display:block;overflow:visible;padding:12px 10px 90px}
  body.present .frame{display:none} body.present .frame.active{display:block}
  .frame{width:auto !important;height:auto !important;margin:0 0 14px !important;scroll-margin-top:60px}
  .slide{position:relative;transform:none !important;width:auto;height:auto;padding:26px 18px 28px;overflow:visible}
  body.doc .toolbar{display:none}
  .toolbar{position:sticky;bottom:0;background:rgba(248,247,252,.95)}
  .timer,.counter{display:none}
  h1{font-size:34px} h2{font-size:25px} .lead{font-size:15px} .big-q{font-size:21px}
  .g2,.g3,.g4,.g5,.split{grid-template-columns:1fr !important}
  .steps.row{grid-auto-flow:row}
  .flow{flex-wrap:wrap}.flow .node{min-width:130px}.flow .arrow{display:none}
  .title-wrap{grid-template-columns:1fr}
  .qr{display:none}
  .callout{font-size:16.5px}
  .refs{columns:1}
  .board-form{flex-wrap:wrap}.board-form .name{width:100%}
  .notes{max-height:360px}
  .hbar{grid-template-columns:96px 1fr 40px;font-size:13px}
  .reveal-row{flex-direction:column;align-items:stretch}
  .toc-fab{display:flex;position:fixed;right:16px;bottom:18px;z-index:40;align-items:center;gap:6px;border:0;font:inherit;font-weight:700;font-size:14px;color:#fff;background:var(--accent);padding:12px 18px;border-radius:999px;box-shadow:0 8px 24px rgba(60,50,170,.35)}
  table.mac td,table.mac th{padding:9px 12px;font-size:14px}
  .src{margin-top:14px}
}

/* ============ PDF (인쇄) — 16:9 슬라이드 1장 = 1쪽 ============ */
@media print{
  @page{size:13.333in 7.5in;margin:0}
  html,body{height:auto !important;overflow:visible !important;background:#fff !important}
  body{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .menubar,.titlebar,.sidebar,.toolbar,.toast,.modal,.sheet,.toc-fab,.board-form,.board-meta,.empty,[data-reveal],[data-reveal-quiz]{display:none !important}
  .window{position:static !important;display:block !important;background:none !important;box-shadow:none !important;border-radius:0 !important;backdrop-filter:none !important;overflow:visible !important}
  .stage{display:block !important;overflow:visible !important;padding:0 !important;background:none !important}
  .frame{display:block !important;width:1280px !important;height:720px !important;margin:0 !important;overflow:hidden;break-after:page;page-break-after:always}
  .frame:last-child{break-after:auto;page-break-after:auto}
  .slide{transform:none !important;border-radius:0 !important;box-shadow:none !important;animation:none !important}
  .reveal-box{display:block !important}
  .quiz .answer{display:block !important}
}

<body class="present">

<div class="menubar">

  <button class="mb-btn" data-act="doc">자료</button>
  <button class="mb-btn" data-act="ref">참고문헌</button>
  <button class="mb-btn" data-act="qr">▦ QR 접속</button>
  <button class="mb-btn" data-act="pdf">⬇ PDF 저장</button>
  <div class="right"><span id="liveMenu">○ 오프라인</span><span class="clock" id="clock"></span></div>
</div>

<div class="window">
  <div class="titlebar">
    <div class="lights"><span class="r"></span><span class="y"></span><span class="g"></span></div>
    <button class="icon-btn" id="menuBtn" data-act="toc" aria-label="목차">☰</button>
    <div class="title" id="winTitle">대신 읽어주는 AI에서 읽기를 돕는 AI로</div>
    <div class="seg">
      <button id="mPresent" class="on">발표</button>
      <button id="mDoc">자료</button>
    </div>
    <button class="icon-btn" data-act="qr" title="QR로 접속">▦</button>
    <button class="icon-btn" data-act="pdf" title="자료 PDF로 저장">⬇</button>
    <button class="icon-btn" id="fsBtn" title="전체화면 발표 (F)">⛶</button>
  </div>

  <nav class="sidebar" id="sidebar"></nav>
  <main class="stage" id="stage"></main>

  <div class="toolbar">
    <div class="nav">
      <button class="btn" id="prev">‹ 이전</button>
      <button class="btn primary" id="next">다음 ›</button>

    <div class="progress"><i id="bar"></i></div>

  </div>
</div>

<button class="toc-fab" data-act="toc">☰ 목차</button>

<div class="sheet" id="tocSheet">
  <div class="panel">
    <div class="head"><span>목차</span><button class="icon-btn" data-act="toc-close" aria-label="닫기">✕</button></div>
    <div class="list" id="tocList"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="modal" id="qrModal">
  <div class="box">
    <h3>휴대폰으로 접속하기</h3>
    <p class="muted" style="font-size:14px">카메라로 QR을 비추면 강의 자료가 열립니다</p>
    <img id="qrImg" alt="웹앱 접속 QR">
    <div class="u" id="qrUrl"></div>
    <div class="btn-row" style="justify-content:center">
      <button class="btn" id="qrCopy">주소 복사</button>
      <button class="btn primary" id="qrClose">닫기</button>
    </div>
  </div>
</div>

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pageURL = () => location.href.split('#')[0].split('?')[0];
const short = t => t.split('.')[0].split('(')[0].trim();
function src(...keys){
  return `<div class="src">출처 · ${keys.map(k=>`<a href="${REFS[k].u}" target="_blank" rel="noopener">${esc(short(REFS[k].t))} ↗</a>`).join('')}</div>`;
}
function linkBtn(url, label, cls=''){
  if(!url) return `<span class="linkbtn off ${cls}">${label} · 링크 준비 중</span>`;
  return `<a class="linkbtn ${cls}" href="${esc(url)}" target="_blank" rel="noopener">${label} ↗</a>`;
}
function board(id, placeholder){
  return `<div class="board grow" data-board="${id}">
    <form class="board-form">
      <input class="name" maxlength="20" placeholder="이름·교과 (선택)">

}
function quiz(id, q, opts, correct, answer){

    <div class="q">${q}</div>
    <div class="opts">${opts.map(o=>`<button class="opt" data-v="${o.v}"><span class="bar"></span><span class="lbl">${o.t}</span><span class="pct">0%</span></button>`).join('')}</div>
    <div class="qfoot"><span class="votes">먼저 추측해 보세요</span><button class="btn" data-reveal-quiz>정답 공개</button></div>

}
function shot(src, alt, caption, placeholder, style=''){
  return `<div class="shot-wrap" style="${style}">
    <img class="shot" src="${esc(src)}" alt="${esc(alt)}" onerror="this.parentElement.classList.add('missing')">
    <div class="placeholder">${placeholder||''}</div>
    ${caption?`<div class="cap">${caption}</div>`:''}
  </div>`;
}

/* ---------- 차트 ---------- */
function pisaChart(){
  const data = [[2006,556],[2012,536],[2022,515],[2025,501]];
  const W=540,H=230,pl=40,pr=20,pt=24,pb=30,min=440,max=580;
  const xs = i => pl + i*(W-pl-pr)/(data.length-1);
  const ys = v => pt + (max-v)/(max-min)*(H-pt-pb);
  let g = [460,500,540,580].map(t=>`<line class="grid-l" x1="${pl}" x2="${W-pr}" y1="${ys(t)}" y2="${ys(t)}"/><text class="axis-t" x="${pl-8}" y="${ys(t)+4}" text-anchor="end">${t}</text>`).join('');
  g += `<line x1="${pl}" x2="${W-pr}" y1="${ys(461)}" y2="${ys(461)}" stroke="#9a9ab0" stroke-width="1.5" stroke-dasharray="4 4"/><text class="axis-t" x="${W-pr}" y="${ys(461)-6}" text-anchor="end">OECD 평균 461 (2025)</text>`;
  g += `<path d="${data.map((d,i)=>`${i?'L':'M'}${xs(i)},${ys(d[1])}`).join(' ')}" fill="none" stroke="#5856d6" stroke-width="2.5" stroke-linejoin="round"/>`;
  data.forEach((d,i)=>{
    const last = i===data.length-1;
    g += `<g><title>${d[0]}년: ${d[1]}점</title><circle class="hit" cx="${xs(i)}" cy="${ys(d[1])}" r="18"/><circle cx="${xs(i)}" cy="${ys(d[1])}" r="${last?7:5}" fill="${last?'#d63a2f':'#5856d6'}" stroke="#fff" stroke-width="2"/></g>`;
    g += `<text class="val-t" x="${xs(i)}" y="${ys(d[1])-13}" text-anchor="middle" ${last?'style="fill:#d63a2f"':''}>${d[1]}</text>`;
    g += `<text class="axis-t" x="${xs(i)}" y="${H-8}" text-anchor="middle">${d[0]}</text>`;
  });
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="PISA 한국 읽기 점수: 2006년 556, 2012년 536, 2022년 515, 2025년 501">${g}</svg></div>`;
}
function waffle(pct){
  const on = Math.round(pct);
  return `<div class="waffle" role="img" aria-label="중1 읽기 저수행군 ${pct}%">${Array.from({length:100},(_,i)=>`<i class="${i<on?'on':''}"></i>`).join('')}</div>`;
}
function dumbbell(label, a, b, color){
  const x = v => (v/20*100).toFixed(1)+'%';
  const lo=Math.min(a,b), hi=Math.max(a,b);
  return `<div class="dumb"><span>${label}</span><div class="line">
    <div class="seg" style="left:${x(lo)};width:calc(${x(hi)} - ${x(lo)})"></div>
    <div class="p" style="left:${x(a)};background:#c9c7e8"><em style="color:#9a9ab0">${a}%</em></div>
    <div class="p" style="left:${x(b)};background:${color}"><em style="color:${color}">${b}%</em></div>
  </div></div>`;
}
function hbars(rows){
  return rows.map(r=>`<div class="hbar"><span>${r[0]}</span><div class="track"><div class="fill" style="width:${r[1]/5*100}%"></div></div><b>${r[1].toFixed(2)}</b></div>`).join('');
}

/* Kreijkes 퀴즈 */

    ['note','both'],
    '<b>노트를 쓴 집단!</b> 노트만 쓴 학생, 노트와 AI를 함께 쓴 학생 모두 <b>AI만 쓴 학생보다</b> 이해와 기억이 높았습니다.')}
  ${quiz('guess2','Q2. 학생들은 어느 방법을 가장 선호했을까요?',

  </div>
</div>`},

/* Facilitate */
{sec:'s1', nav:'AI의 역할: Replace가 아니라 Facilitate', html:`
<div class="kicker"><span class="chip">1. 도입</span></div>
<h2>AI의 역할을 먼저 정합니다</h2>
<div class="big-q">AI는 읽기를 <span style="color:var(--bad);text-decoration:line-through">대신하지</span> 않는다. 읽기를 <span style="color:var(--accent)">촉진(facilitate)</span>한다.</div>
<table class="mac">
  <tr><th class="bad">AI가 대신 읽기 (Replace)</th><th class="good">AI가 읽기를 촉진 (Facilitate)</th></tr>
  <tr><td>요약을 준다</td><td>배경지식을 깨운다</td></tr>
  <tr><td>해석을 준다</td><td>질문하고 되묻는다</td></tr>
  <tr><td>감상을 써 준다</td><td>다른 관점을 맞세운다</td></tr>
  <tr><td>학생은 결과를 받는다</td><td><b>학생이 읽는 과정을 계속 수행한다</b></td></tr>
</table>
<div class="callout mt-l">AI는 문턱을 낮추고, 생각은 학생이 한다.
<span class="sub">이 기준으로 세 가지 사례를 봅니다. ① 교사의 수업 준비 ② 학생의 읽기 지원 ③ 학생의 해석 끌어내기</span></div>`},

<p class="lead" style="margin-bottom:12px">우리 반 학생들이 실제로 했던 인물 토론을 그대로 해 봅니다. 로그인 없이 학생 입장으로 참여할 수 있어요.</p>
<div class="split" style="grid-template-columns:1fr 300px;align-items:center">
  <div class="steps row">
    <div class="step"><div><b>링크 접속</b><span>버튼 또는 QR</span></div></div>
    <div class="step"><div><b>지문 읽기</b><span>본문 다시 보기</span></div></div>
    <div class="step"><div><b>인물과 토론</b><span>따져 묻고 근거 찾기</span></div></div>
    <div class="step"><div><b>한 문장 공유</b><span>아래 보드에</span></div></div>
  </div>
  <div style="text-align:center">${linkBtn(CONFIG.BRISK_PRACTICE_LINK,'Brisk 인물 토론 시작','big')}</div>
</div>
<h3 class="mt">한 문장 공유: 이 활동에서 AI는 읽기를 대신했나요, 촉진했나요?</h3>
${board('practice','대신했다 / 촉진했다 + 이유 한 문장')}`},

/* 유의점 */
{sec:'s5', nav:'AI 읽기 지도 유의점 7', html:`
<div class="kicker"><span class="chip">5. 마무리</span></div>
<h2>AI를 활용한 읽기 학습 지도, 유의할 점</h2>
<div class="grid g4 mt" style="grid-template-rows:1fr 1fr;flex:1">
  <div class="card"><div class="label">01 · 순서</div><h3>먼저 읽고, 나중에 켠다</h3><p class="sm">첫 이해와 첫 해석은 학생 손으로. 노트 쓰기 효과가 근거입니다.</p></div>
  <div class="card"><div class="label">02 · 역할</div><h3>답이 아니라 질문</h3><p class="sm">AI를 요약기가 아니라 힌트, 되묻기, 반론 상대로 설정합니다.</p></div>
  <div class="card"><div class="label">03 · 착각</div><h3>이해한 느낌을 경계하기</h3><p class="sm">AI 없이 다시 요약하기 같은 확인 활동을 반드시 넣습니다.</p></div>
  <div class="card"><div class="label">04 · 근거</div><h3>원문으로 돌아가기</h3><p class="sm">AI의 말은 지문과 대조해 검증하게 합니다.</p></div>
  <div class="card"><div class="label">05 · 수준</div><h3>수준별로 다르게</h3><p class="sm">저수행 학생은 어휘·해독 지원, 상위 학생은 비판적 읽기에 씁니다.</p></div>
  <div class="card"><div class="label">06 · 평가</div><h3>과정을 기록하고 평가하기</h3><p class="sm">결과물보다 질문과 대화의 흔적을 봅니다.</p></div>
  <div class="card" style="grid-column:span 2"><div class="label">07 · 안전</div><h3>개인정보와 연령 기준</h3><p class="sm">도구별 이용 연령, 학생 계정 운영 방식, 입력하면 안 되는 정보를 미리 확인하고 안내합니다.</p></div>
</div>`},

/* 맺음말 */
{sec:'s5', nav:'맺음말', html:`
<div style="flex:1;display:flex;flex-direction:column;justify-content:center">
  <div class="kicker"><span class="chip">5. 마무리</span></div>
  <h1>AI가 읽어 줄수록,<br>교사는 학생이 <span style="color:var(--accent)">읽게 만드는</span><br>설계를 해야 합니다.</h1>
  <p class="lead mt-l">감사합니다 · ${esc(CONFIG.SPEAKER)}</p>
</div>`},

/* 질문 및 소감 */
{sec:'s5', nav:'질문 및 소감 공유', id:'qna', html:`
<div class="kicker"><span class="chip">5. 마무리</span><span class="chip gray">Q&amp;A</span></div>
<h2>질문 및 소감 공유</h2>
<p class="lead">궁금한 점, 내 수업에 적용해 보고 싶은 점, 오늘의 소감을 자유롭게 남겨 주세요.</p>
${board('qna','질문이나 소감을 남겨 주세요')}`},

/* 참고 자료 */
{sec:'ref', nav:'참고 자료 · 논문 링크', id:'ref', html:`
<div class="kicker"><span class="chip gray">참고 자료</span></div>
<h2>참고 자료 · 원문 링크</h2>
<div class="refs mt-s">
  <div class="ref-group"><h3>📚 연구 논문</h3>${['kreijkes','kreijkesPdf','gerlich','aaai'].map(refItem).join('')}</div>
  <div class="ref-group"><h3>📊 읽기 역량 데이터</h3>${['pisa','pisaKr','pisaKr2','kice'].map(refItem).join('')}</div>
  <div class="ref-group"><h3>🧑‍🏫 강의 사례 링크</h3>${['notebook','padlet1','capApp','capRep','padlet2','brisk'].map(refItem).join('')}</div>
  <div class="ref-group"><h3>📰 AI 부정행위 보도</h3>${['tax1','tax2','tax3','toeic','cert','leet','hrdk','berkeley'].map(refItem).join('')}</div>
</div>`}
];
function refItem(k){
  const r = REFS[k];
  return `<a class="ref" href="${esc(r.u)}" target="_blank" rel="noopener"><span class="go">↗</span><span><b>${esc(r.t)}</b> <span>${esc(r.d)}</span></span></a>`;
}

/* =========================================================
   렌더링 & 내비게이션
   ========================================================= */
const $ = s => document.querySelector(s);
const stage = $('#stage'), sidebar = $('#sidebar');
const slideId = (s,i) => s.id || 'slide-'+i;
const isMobile = () => window.innerWidth < 760;
let cur = 0, mode = 'present';

stage.innerHTML = SLIDES.map((s,i)=>`<div class="frame" id="${slideId(s,i)}" data-i="${i}"><section class="slide">${s.html}</section></div>`).join('');
const tocHTML = SECTIONS.map(sec=>{
  const items = SLIDES.map((s,i)=>({s,i})).filter(o=>o.s.sec===sec.id);
  return `<div class="toc-group"><div class="toc-head"><span>${sec.name}</span><span class="min">${sec.min}</span></div>
    ${items.map(o=>`<div class="toc-item" data-go="${o.i}"><span class="num">${o.i}</span><span>${esc(o.s.nav)}</span></div>`).join('')}</div>`;
}).join('');
sidebar.innerHTML = tocHTML;
$('#tocList').innerHTML = tocHTML;

const participantURL = () => pageURL() + '?mode=doc';
function qrSrc(size){
  try{ const q = qrcode(0,'M'); q.addData(participantURL()); q.make(); const n=q.getModuleCount(); const cell=Math.max(2,Math.floor(size/(n+2))); return q.createDataURL(cell, cell); }
  catch(_){ return `https://api.qrserver.com/v1/create-qr-code/?size=${size}x${size}&margin=0&data=${encodeURIComponent(participantURL())}`; }
}
document.querySelectorAll('[data-qr]').forEach(img=>img.src = qrSrc(320));

/* 16:9 캔버스를 화면에 맞게 축소·확대 */
function fit(){
  if(isMobile()){ stage.style.removeProperty('--s'); return; }
  const W = stage.clientWidth, H = stage.clientHeight;
  const pad = document.body.classList.contains('fs') ? 0 : 40;
  const s = mode==='present' ? Math.min((W-pad)/1280, (H-pad)/720) : Math.min(1.25, (W-56)/1280);
  stage.style.setProperty('--s', Math.max(.2, s).toFixed(4));
}
window.addEventListener('resize', fit);

function markNav(){
  document.querySelectorAll('.toc-item').forEach(el=>el.classList.toggle('on', +el.dataset.go===cur));
  $('#counter').textContent = `${cur} / ${SLIDES.length-1}`;
  $('#bar').style.width = (cur/(SLIDES.length-1)*100)+'%';
  const sec = SECTIONS.find(s=>s.id===SLIDES[cur].sec);
  $('#winTitle').textContent = (sec && sec.id!=='start' ? sec.name + ' — ' : '') + SLIDES[cur].nav;
}
function go(i, scroll=true){
  cur = Math.max(0, Math.min(SLIDES.length-1, i));
  document.querySelectorAll('.frame').forEach((el,k)=>el.classList.toggle('active', k===cur));
  markNav();
  $('#prev').disabled = cur===0;
  $('#next').disabled = cur===SLIDES.length-1;
  history.replaceState(null,'', location.pathname + location.search + '#' + slideId(SLIDES[cur],cur));
  if(mode==='doc' && scroll){ document.querySelectorAll('.frame')[cur].scrollIntoView({behavior:'smooth', block:'start'}); }
  const side = sidebar.querySelector('.toc-item.on'); if(side) side.scrollIntoView({block:'nearest'});
}
function setMode(m){
  mode = m;
  document.body.classList.toggle('present', m==='present');
  document.body.classList.toggle('doc', m==='doc');
  $('#mPresent').classList.toggle('on', m==='present');
  $('#mDoc').classList.toggle('on', m==='doc');
  fit(); go(cur, true);
}

/* 목차 (데스크톱 사이드바 / 모바일 팝업) */
function openTOC(){
  $('#tocSheet').classList.add('show');
  const on = $('#tocList .toc-item.on'); if(on) on.scrollIntoView({block:'center'});
}
function closeTOC(){ $('#tocSheet').classList.remove('show'); }
document.addEventListener('click', e=>{
  const it = e.target.closest('.toc-item');
  if(it){ closeTOC(); go(+it.dataset.go); return; }
  if(e.target.id==='tocSheet') closeTOC();
});

$('#prev').onclick = ()=>go(cur-1);
$('#next').onclick = ()=>go(cur+1);
$('#mPresent').onclick = ()=>setMode('present');
$('#mDoc').onclick = ()=>setMode('doc');
$('#fsBtn').onclick = toggleFS;
function toggleFS(){
  if(!document.fullscreenElement){ if(mode!=='present') setMode('present'); document.documentElement.requestFullscreen?.(); }
  else { document.exitFullscreen?.(); }
}
document.addEventListener('fullscreenchange', ()=>{
  document.body.classList.toggle('fs', !!document.fullscreenElement);
  requestAnimationFrame(fit);
});

/* 메뉴바·타이틀바 동작 */
document.addEventListener('click', e=>{
  const b = e.target.closest('[data-act]'); if(!b) return;
  const act = b.dataset.act;
  if(act==='present') setMode('present');
  if(act==='doc') setMode('doc');
  if(act==='ref') go(SLIDES.findIndex(s=>s.id==='ref'));
  if(act==='qr') openQR();
  if(act==='pdf') savePDF();
  if(act==='toc') openTOC();
  if(act==='toc-close') closeTOC();
});

function openQR(){
  $('#qrImg').src = qrSrc(500);
  $('#qrUrl').textContent = participantURL();
  $('#qrModal').classList.add('show');
}
$('#qrClose').onclick = ()=>$('#qrModal').classList.remove('show');
$('#qrModal').onclick = e=>{ if(e.target.id==='qrModal') $('#qrModal').classList.remove('show'); };
$('#qrCopy').onclick = async ()=>{ try{ await navigator.clipboard.writeText(participantURL()); toast('주소를 복사했어요'); }catch(_){ toast(participantURL()); } };

/* PDF: 인쇄 대화상자 → 'PDF로 저장' (16:9, 1장 = 1쪽) */
function savePDF(){
  toast('인쇄 창에서 대상을 ‘PDF로 저장’으로 선택하세요');
  setTimeout(()=>window.print(), 350);
}

document.addEventListener('keydown', e=>{
  if(e.target.matches('input,textarea')) return;
  if(e.key==='Escape'){ $('#qrModal').classList.remove('show'); closeTOC(); }
  if(mode==='present' && ['ArrowRight','PageDown',' '].includes(e.key)){ e.preventDefault(); go(cur+1); }
  if(mode==='present' && ['ArrowLeft','PageUp'].includes(e.key)){ e.preventDefault(); go(cur-1); }
  if(e.key==='f'||e.key==='F') toggleFS();
  if(e.key==='d'||e.key==='D') setMode(mode==='present'?'doc':'present');
});

/* 자료 모드: 스크롤 위치에 따라 현재 슬라이드 표시 */
const io = new IntersectionObserver(ents=>{
  if(mode!=='doc') return;
  ents.forEach(en=>{ if(en.isIntersecting){ const i=+en.target.dataset.i; if(i!==cur){ cur=i; markNav(); } } });
},{root: isMobile() ? null : stage, rootMargin:'-30% 0px -60% 0px'});
document.querySelectorAll('.frame').forEach(el=>io.observe(el));

/* 결론 보기 */
stage.addEventListener('click', e=>{
  const b = e.target.closest('[data-reveal]'); if(!b) return;
  const box = document.getElementById(b.dataset.reveal);
  const show = !box.classList.contains('show');
  box.classList.toggle('show', show);
  b.textContent = show ? '숨기기' : '결론 보기 ›';
});

function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),2200); }

/* 시계 & 타이머 */
function tickClock(){ $('#clock').textContent = new Date().toLocaleTimeString('ko-KR',{hour:'numeric',minute:'2-digit'}); }
tickClock(); setInterval(tickClock, 15000);
let tStart=null, tAcc=0, tInt=null;
function fmt(ms){ const s=Math.floor(ms/1000); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
function drawTimer(){ const ms = tAcc + (tStart? Date.now()-tStart:0); $('#timer').textContent = (tStart?'⏱ ':'⏸ ')+fmt(ms) + ' / 60:00'; $('#timer').style.color = ms>3600000?'var(--bad)':''; }
$('#timer').onclick = ()=>{ if(tStart){ tAcc += Date.now()-tStart; tStart=null; clearInterval(tInt);} else { tStart=Date.now(); tInt=setInterval(drawTimer,1000);} drawTimer(); };
$('#timer').ondblclick = ()=>{ tStart=null; tAcc=0; clearInterval(tInt); drawTimer(); };
drawTimer();

/* =========================================================
   실시간 응답 보드 & 추측 퀴즈
   ========================================================= */
const LIVE = !!CONFIG.SCRIPT_URL;
const BOARD_IDS = ['opening','guess1','guess2','practice','qna'];
const localStore = Object.fromEntries(BOARD_IDS.map(k=>[k,[]]));
const dataCache = Object.fromEntries(BOARD_IDS.map(k=>[k,[]]));
const seen = {};

function renderBoard(id, items){
  dataCache[id] = items;
  document.querySelectorAll(`[data-board="${id}"]`).forEach(b=>{
    const notes = b.querySelector('.notes');
    b.querySelector('.count').textContent = items.length + '개';
    if(!items.length){ notes.innerHTML = '<div class="empty">첫 응답을 기다리는 중이에요</div>'; return; }
    if(items.length===seen[id]) return;
    notes.innerHTML = items.slice().reverse().map(it=>`<div class="note">${esc(it.text)}${it.name?`<span class="who">— ${esc(it.name)}</span>`:''}</div>`).join('');
  });
  seen[id] = items.length;
  renderQuiz(id);
}
function renderQuiz(id){
  const q = document.querySelector(`[data-quiz="${id}"]`); if(!q) return;
  const items = dataCache[id] || [];
  const total = items.length;
  q.querySelectorAll('.opt').forEach(o=>{
    const n = items.filter(it=>it.text===o.dataset.v).length;
    const p = total ? Math.round(n/total*100) : 0;
    o.querySelector('.pct').textContent = `${p}% · ${n}명`;
    o.querySelector('.bar').style.width = q.classList.contains('revealed') ? p+'%' : '0';
  });
  q.querySelector('.votes').textContent = total ? `${total}명이 추측했어요` : '먼저 추측해 보세요';
}
function setStatus(ok, msg){
  document.querySelectorAll('.board').forEach(b=>{
    b.querySelector('.dot').classList.toggle('live', ok);
    b.querySelector('.status').textContent = msg;
  });
  $('#liveMenu').textContent = ok ? '● 실시간 연결됨' : '○ ' + (LIVE?'연결 확인 중':'체험 모드');
}
async function poll(){
  if(!LIVE) return;
  try{
    const r = await fetch(CONFIG.SCRIPT_URL + '?action=list&_=' + Date.now());
    const j = await r.json();
    if(!j.ok) throw new Error('bad');
    Object.keys(j.boards||{}).forEach(k=>renderBoard(k, j.boards[k]));
    setStatus(true, '실시간 연결됨 · 5초마다 새로고침');
  }catch(err){ setStatus(false, '연결 오류 · 다시 시도 중'); }
}
async function send(board, name, text){
  if(LIVE){
    await fetch(CONFIG.SCRIPT_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({board, name, text})});
    await poll();
  } else {
    localStore[board].push({t:Date.now(), name, text});
    renderBoard(board, localStore[board]);
  }
}
document.addEventListener('submit', async e=>{
  const form = e.target.closest('.board-form'); if(!form) return;
  e.preventDefault();
  const id = form.closest('[data-board]').dataset.board;
  const name = form.querySelector('.name').value.trim();
  const textEl = form.querySelector('.text');
  const text = textEl.value.trim();
  if(!text) return;
  const btn = form.querySelector('button'); btn.disabled = true;
  try{ await send(id, name, text); textEl.value=''; toast('응답을 보냈어요'); }
  catch(err){ toast('전송에 실패했어요. 다시 시도해 주세요'); }
  btn.disabled = false;
});

const voted = {};
stage.addEventListener('click', async e=>{
  const opt = e.target.closest('.quiz .opt');
  if(opt){
    const q = opt.closest('.quiz'), id = q.dataset.quiz;
    if(voted[id]){ toast('이미 추측을 보냈어요'); return; }
    voted[id] = opt.dataset.v; opt.classList.add('mine');
    try{ await send(id, '', opt.dataset.v); toast('추측을 보냈어요'); }
    catch(_){ toast('전송에 실패했어요'); voted[id]=null; opt.classList.remove('mine'); }
    return;
  }
  const rv = e.target.closest('[data-reveal-quiz]');
  if(rv){
    const q = rv.closest('.quiz');
    const correct = q.dataset.correct.split(',');
    q.classList.toggle('revealed');
    q.querySelectorAll('.opt').forEach(o=>o.classList.toggle('correct', correct.includes(o.dataset.v)));
    rv.textContent = q.classList.contains('revealed') ? '정답 숨기기' : '정답 공개';
    renderQuiz(q.dataset.quiz);
  }
});

if(LIVE){ setStatus(false,'연결 중…'); poll(); setInterval(poll, CONFIG.POLL_MS); }
else { setStatus(false, '체험 모드 · CONFIG.SCRIPT_URL을 넣으면 실시간 공유'); }

/* 인쇄(PDF) 시 퀴즈 정답 펼치기 */
window.addEventListener('beforeprint', ()=>{
  document.querySelectorAll('.quiz').forEach(q=>{
    const correct = q.dataset.correct.split(',');
    q.classList.add('revealed');
    q.querySelectorAll('.opt').forEach(o=>o.classList.toggle('correct', correct.includes(o.dataset.v)));
    renderQuiz(q.dataset.quiz);
  });
});

/* 시작 */
const params = new URLSearchParams(location.search);
const startIdx = SLIDES.findIndex((s,k)=>slideId(s,k)===location.hash.slice(1));
if(startIdx>=0) cur = startIdx;
setMode(params.get('mode')==='doc' || isMobile() ? 'doc' : 'present');

</script>
</body>
</html>
